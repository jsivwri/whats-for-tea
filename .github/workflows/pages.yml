name: Recipe library
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.target.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - id: target
        env:
          REPO_NAME: ${{ github.event.repository.name }}
          OWNER: ${{ github.repository_owner }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          CURRENT_BRANCH: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$REPO_NAME" = "$OWNER.github.io" ]; then
            echo 'PAGES_BASE=/' >> "$GITHUB_ENV"
          else
            printf 'PAGES_BASE=/%s/\n' "$REPO_NAME" >> "$GITHUB_ENV"
          fi
          if [ "$EVENT" != pull_request ] && [ "$CURRENT_BRANCH" = "$DEFAULT_BRANCH" ]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          fi
      - run: npm ci
      - run: npm run validate && npm test && npm run build && npm run smoke
      - uses: actions/upload-pages-artifact@v4
        if: steps.target.outputs.deploy == 'true'
        with:
          path: dist

  deploy:
    needs: verify
    if: needs.verify.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - id: publish
        uses: actions/deploy-pages@v4
